name: iPadOS Build & IPA Package

on:
  push:
    branches: [ master, main, android, 'loimathos/**', 'feat/**' ]
    paths:
      - 'src/ipad/**'
      - '.github/workflows/ios.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, android ]
    paths:
      - 'src/ipad/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build iPadOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Build and Archive (Ad-Hoc / Developer Mode)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project src/ipad/DubInstante.xcodeproj \
            -scheme DubInstante \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/DubInstante.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/DubInstante.xcarchive/Products/Applications/DubInstante.app" build/Payload/
          cd build
          zip -qr "DubInstante.ipa" Payload/
          ls -lh DubInstante.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubInstante-iPadOS-ipa
          path: build/DubInstante.ipa
          if-no-files-found: error
          retention-days: 14
