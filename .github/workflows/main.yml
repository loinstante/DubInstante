# Licence des binaires FFmpeg embarqués — décidé une fois, appliqué aux trois jobs.
#
# DubInstante est sous EUPL-1.2, dont l'appendice liste la GPL v3 parmi les
# « Compatible Licences » (article 5). Une build FFmpeg --enable-gpl peut donc
# être distribuée avec : le paquet produit est alors couvert par la GPL v3, ce
# que l'article 5 de l'EUPL prévoit explicitement. C'est la build retenue sur
# les trois plateformes — elle apporte libx264, donc l'export H.264 sans
# dépendance système. La contrepartie est documentée dans THIRD_PARTY_LICENSES,
# copié à la racine de chaque paquet : source disponible des deux côtés.
#
# Pas de build LGPL : elle imposerait à l'utilisateur d'installer un ffmpeg
# système pour exporter en H.264, ce qui est exactement le problème que
# l'embarquement résout.

name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux, Debug)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake pkg-config zip unzip libgl1-mesa-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libasound2-dev libpulse-dev libxcb-cursor0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtmultimedia'

    - name: Configure
      run: cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build-test -j"$(nproc)"

    - name: Run tests
      run: ctest --test-dir build-test --output-on-failure

  build-linux:
    name: Linux Build
    needs: test
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake wget libfuse2 libgl1-mesa-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libasound2-dev libpulse-dev libxcb-cursor0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtmultimedia'

    - name: Build and Package AppImage
      run: |
        bash deploy/build_appimage.sh

    - name: Get Version
      id: get_version
      run: |
        VERSION=$(grep -m 1 "## \[" CHANGELOG.md | sed -n 's/.*\[\([0-9.]*\)\].*/\1/p')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DubInstante_linux_${{ steps.get_version.outputs.version }}
        path: DubInstante_linux_*.AppImage

  build-windows:
    name: Windows Build
    needs: test
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtmultimedia'

    - name: Download FFmpeg
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg
        Rename-Item -Path "C:\ffmpeg\ffmpeg-master-latest-win64-gpl-shared" -NewName "ffmpeg-bin"

    - name: Configure CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }};C:/ffmpeg/ffmpeg-bin"

    - name: Build
      shell: cmd
      run: |
        cd build
        cmake --build . --config Release

    - name: Package with windeployqt
      shell: cmd
      run: |
        mkdir dist
        copy build\Release\DubInstante.exe dist\
        copy C:\ffmpeg\ffmpeg-bin\bin\*.dll dist\
        copy C:\ffmpeg\ffmpeg-bin\bin\ffmpeg.exe dist\
        copy C:\ffmpeg\ffmpeg-bin\bin\ffprobe.exe dist\
        copy LICENSE dist\
        copy THIRD_PARTY_LICENSES dist\
        windeployqt.exe --release --no-translations --compiler-runtime --multimedia dist\DubInstante.exe

    - name: Verify bundled FFmpeg
      run: |
        foreach ($tool in "ffmpeg.exe", "ffprobe.exe") {
          if (-not (Test-Path "dist\$tool")) {
            Write-Host "ERROR: $tool is missing from the package"
            exit 1
          }
        }
        # Lancé depuis dist\ : il doit trouver ses DLL libav* là, pas ailleurs.
        & .\dist\ffmpeg.exe -version | Select-Object -First 1
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Get Version
      id: get_version
      shell: bash
      run: |
        VERSION=$(grep -m 1 "## \[" CHANGELOG.md | sed -n 's/.*\[\([0-9.]*\)\].*/\1/p')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DubInstante_windows_${{ steps.get_version.outputs.version }}
        path: dist/

  build-macos:
    name: macOS Build
    needs: test
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install ffmpeg pkg-config

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtmultimedia'

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_BUNDLE=ON -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }};/opt/homebrew"

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Package with macdeployqt
      run: |
        find build -name "DubInstante.app" -type d
        APP_PATH=$(find build -name "DubInstante.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: Could not find DubInstante.app"
          exit 1
        fi
        macdeployqt "$APP_PATH" -verbose=1

    - name: Bundle FFmpeg
      run: |
        brew install dylibbundler
        APP_PATH=$(find build -name "DubInstante.app" -type d | head -n 1)
        cp "$(command -v ffmpeg)" "$(command -v ffprobe)" "$APP_PATH/Contents/MacOS/"
        cp LICENSE THIRD_PARTY_LICENSES "$APP_PATH/Contents/Resources/"
        # Les binaires Homebrew pointent vers /opt/homebrew, qui n'existe pas chez
        # l'utilisateur : dylibbundler copie leur fermeture de dylibs dans le
        # bundle et réécrit les install names en @executable_path.
        for tool in ffmpeg ffprobe; do
          dylibbundler -cd -of -b \
            -x "$APP_PATH/Contents/MacOS/$tool" \
            -d "$APP_PATH/Contents/libs" \
            -p "@executable_path/../libs"
        done

    - name: Ad-hoc code sign
      run: |
        APP_PATH=$(find build -name "DubInstante.app" -type d | head -n 1)
        # Les dylibs recopiées et les deux binaires d'abord : --deep ne suffit pas
        # à rendre valide pour --strict du code ajouté après macdeployqt.
        for lib in "$APP_PATH"/Contents/libs/*.dylib; do
          codesign --force --sign - "$lib"
        done
        codesign --force --sign - "$APP_PATH/Contents/MacOS/ffmpeg" "$APP_PATH/Contents/MacOS/ffprobe"
        codesign --force --deep --sign - "$APP_PATH"
        echo "Ad-hoc signing complete"

    - name: Verify bundle
      run: |
        APP_PATH=$(find build -name "DubInstante.app" -type d | head -n 1)
        for tool in ffmpeg ffprobe; do
          if [ ! -x "$APP_PATH/Contents/MacOS/$tool" ]; then
            echo "ERROR: $tool is missing from the bundle"
            exit 1
          fi
          # Un seul /opt/homebrew restant et le binaire est mort sur une machine vierge.
          if otool -L "$APP_PATH/Contents/MacOS/$tool" | grep -q "/opt/homebrew"; then
            echo "ERROR: $tool still links against Homebrew:"
            otool -L "$APP_PATH/Contents/MacOS/$tool"
            exit 1
          fi
          "$APP_PATH/Contents/MacOS/$tool" -version | head -n 1
        done
        codesign --verify --deep --strict --verbose=2 "$APP_PATH"

    - name: Create DMG
      run: |
        APP_PATH=$(find build -name "DubInstante.app" -type d | head -n 1)
        hdiutil create -volname "DubInstante" -srcfolder "$APP_PATH" -ov -format UDZO "build/DubInstante.dmg"

    - name: Get Version
      id: get_version
      shell: bash
      run: |
        VERSION=$(grep -m 1 "## \[" CHANGELOG.md | sed -n 's/.*\[\([0-9.]*\)\].*/\1/p')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DubInstante_macos_${{ steps.get_version.outputs.version }}
        path: build/DubInstante.dmg

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux, build-windows, build-macos ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Collect release files
      run: |
        mkdir release
        cp artifacts/DubInstante_linux_*/*.AppImage release/
        cp artifacts/DubInstante_macos_*/DubInstante.dmg "release/$(basename artifacts/DubInstante_macos_*).dmg"
        win=$(basename artifacts/DubInstante_windows_*)
        (cd "artifacts/$win" && zip -qr "$GITHUB_WORKSPACE/release/$win.zip" .)

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
